name: publish

# Publishes to PyPI using Trusted Publishing (OpenID Connect). No API token
# and no password is stored anywhere: GitHub proves the workflow's identity to
# PyPI directly. Configure the matching publisher at
# pypi.org -> Publishing -> Add a new pending publisher.
#
# Triggered by pushing a version tag, for example:
#     git tag v1.0.1 && git push origin v1.0.1

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
